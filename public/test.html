<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test des trophées</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px 0;
            background: #15181e;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
        }

        main {
            width: min(520px, calc(100% - 32px));
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            background: #222731;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            margin: 0 0 22px;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffe56b, #f2aa00);
            color: #241800;
            font: inherit;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(242, 170, 0, 0.3);
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #status {
            min-height: 20px;
            margin-top: 16px;
            color: #80f0a3;
            font-weight: 700;
        }

        .emerald-preview {
            margin-top: 26px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            text-align: left;
        }

        .emerald-preview h2 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .emerald-preview p {
            margin-bottom: 12px;
            font-size: 13px;
        }

        .emerald-preview iframe {
            display: block;
            width: 100%;
            height: 700px;
            border: 0;
            background: transparent;
        }
    </style>
</head>

<body>
    <main>
        <h1>Test des trophées</h1>
        <p>Déclenche les animations de la barre et de la LED sans modifier ta progression réelle.</p>
        <button id="simulate" type="button">🏆 Simuler un trophée</button>
        <div id="status" role="status"></div>

        <section class="emerald-preview">
            <h2>Aperçu de la liste la plus haute</h2>
            <p>La zone contenant le plus de lignes de Pokémon dans les données d’Émeraude.</p>
            <iframe
                src="/emerald.html?preview=max-encounters"
                title="Aperçu de la liste de rencontres la plus haute"
            ></iframe>
        </section>
    </main>

    <script>
        "use strict";

        const button = document.getElementById("simulate");
        const status = document.getElementById("status");

        button.addEventListener("click", async () => {
            button.disabled = true;
            status.textContent = "";

            try {
                const response = await fetch("/api/simulate-trophy", { method: "POST" });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error();

                status.textContent = "Simulation envoyée !";
            } catch {
                status.textContent = "La simulation a échoué.";
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
