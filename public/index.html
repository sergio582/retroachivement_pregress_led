<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Progression RetroAchievements</title>
    <style>
        :root {
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.78);
            --track: rgba(0, 0, 0, 0.48);
            --track-border: rgba(255, 255, 255, 0.22);
            --fill-start: #ffd75e;
            --fill-end: #f59f00;
            --shadow: rgba(0, 0, 0, 0.65);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .overlay {
            width: min(850px, 100%);
            filter: drop-shadow(0 3px 5px var(--shadow));
        }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 7px;
            color: var(--text);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            text-shadow: 0 2px 4px var(--shadow);
        }

        .game {
            min-width: 0;
            overflow: hidden;
            font-size: 17px;
            line-height: 1;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .counter {
            flex: 0 0 auto;
            font-size: 21px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .label {
            margin-right: 8px;
            color: var(--muted);
            font-size: 25px;
            font-weight: 700;
        }

        .track {
            position: relative;
            height: 20px;
            overflow: hidden;
            border: 2px solid var(--track-border);
            border-radius: 999px;
            background: var(--track);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55);
        }

        .fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--fill-start), var(--fill-end));
            box-shadow: 0 0 10px rgba(255, 196, 0, 0.65), inset 0 2px 2px rgba(255, 255, 255, 0.42);
            transition: width 900ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.32) 45%, transparent 70%);
            transform: translateX(-110%);
        }

        .overlay.advanced .fill::after {
            animation: shine 900ms ease-out;
        }

        .latest-achievement {
            margin-top: 7px;
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px var(--shadow);
            white-space: nowrap;
        }

        .latest-achievement-label {
            color: var(--muted);
        }

        .status {
            display: none;
            margin-top: 7px;
            color: #ffdddd;
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 2px 4px var(--shadow);
        }

        .overlay.error .status {
            display: block;
        }

        @keyframes shine {
            to {
                transform: translateX(110%);
            }
        }
    </style>
</head>

<body>
    <main class="overlay" id="overlay">
        <div class="header">
            <div class="game" id="game">RetroAchievements</div>
            <div class="counter">
                <span class="label">🏆</span>
                <span id="unlocked">0</span><span> / </span><span id="total">0</span>
            </div>
        </div>

        <div class="track" role="progressbar" aria-label="Progression des succès" aria-valuemin="0" aria-valuemax="0"
            aria-valuenow="0" id="track">
            <div class="fill" id="fill"></div>
        </div>

        <div class="latest-achievement">
            <span class="latest-achievement-label">Dernier trophée :</span>
            <span id="latest-achievement-title">Aucun trophée obtenu</span>
        </div>

        <div class="status" id="status"></div>
    </main>

    <script>
        "use strict";

        const REFRESH_MS = 5000;
        const elements = {
            overlay: document.getElementById("overlay"),
            game: document.getElementById("game"),
            unlocked: document.getElementById("unlocked"),
            total: document.getElementById("total"),
            track: document.getElementById("track"),
            fill: document.getElementById("fill"),
            latestAchievementTitle: document.getElementById("latest-achievement-title"),
            status: document.getElementById("status")
        };

        let previousUnlocked = null;
        let previousSimulationEventId = null;
        let updateInProgress = false;

        function showError(message) {
            elements.overlay.classList.add("error");
            elements.status.textContent = message;
        }

        function clearError() {
            elements.overlay.classList.remove("error");
            elements.status.textContent = "";
        }

        function animateAdvance() {
            elements.overlay.classList.remove("advanced");
            void elements.overlay.offsetWidth;
            elements.overlay.classList.add("advanced");
        }

        function render(data) {
            const unlocked = Number(data.unlocked) || 0;
            const total = Number(data.total) || 0;
            const percentage = Math.min(Math.max(Number(data.percentage) || 0, 0), 100);

            elements.game.textContent = data.gameTitle || "RetroAchievements";
            elements.unlocked.textContent = String(unlocked);
            elements.total.textContent = String(total);
            elements.fill.style.width = `${percentage}%`;
            elements.latestAchievementTitle.textContent =
                data.latestAchievement?.title || "Aucun trophée obtenu";
            elements.track.setAttribute("aria-valuemax", String(total));
            elements.track.setAttribute("aria-valuenow", String(unlocked));

            const simulationEventId = Number(data.simulationEventId) || 0;
            const simulatedTrophy =
                previousSimulationEventId !== null &&
                simulationEventId > previousSimulationEventId;

            if (
                (previousUnlocked !== null && unlocked > previousUnlocked) ||
                simulatedTrophy
            ) {
                animateAdvance();
            }

            previousUnlocked = unlocked;
            previousSimulationEventId = simulationEventId;
            clearError();
        }

        async function updateProgress() {
            if (updateInProgress) return;
            updateInProgress = true;

            try {
                const response = await fetch("/api/progress", { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data.ok) throw new Error(data.error || "Impossible de lire la progression.");
                render(data);
            } catch (error) {
                showError(error.message || "Erreur de mise à jour.");
            } finally {
                updateInProgress = false;
            }
        }

        updateProgress();
        setInterval(updateProgress, REFRESH_MS);
    </script>
</body>

</html>
